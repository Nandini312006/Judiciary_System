<!DOCTYPE html>
<html>

<head>
    <title>NyayaAI</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #0f172a, #1e293b);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            width: 400px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        h2 {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 30px;
        }
        
        input {
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin-bottom: 20px;
            width: 100%;
        }
        
        button {
            padding: 12px;
            width: 100%;
            background: linear-gradient(to right, #2563eb, #1d4ed8);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #2563eb;
        }
        
        #output {
            margin-top: 25px;
            font-size: 15px;
            line-height: 1.5;
            color: #e2e8f0;
        }
        
        .loader {
            margin-top: 15px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>NyayaAI ⚖️</h1>
        <h2>Intelligent Legal Assistant</h2>

        <input type="file" id="fileInput">

        <button onclick="uploadFile()">Summarize Document</button>

        <div class="loader" id="loader">⏳ Processing...</div>

        <p id="output"></p>
    </div>

    <script src="script.js"></script>

</body>

</html>
